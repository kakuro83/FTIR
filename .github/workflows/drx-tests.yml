name: DRX tests
on:
  push:
    paths: ["DRX.py", "drx_core.py", "test_drx*.py", "requirements_drx.txt", ".github/workflows/drx-tests.yml"]
  pull_request:
    paths: ["DRX.py", "drx_core.py", "test_drx*.py", "requirements_drx.txt", ".github/workflows/drx-tests.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements_drx.txt
      - run: python -m pip install -r requirements_drx.txt
      - run: python -m unittest discover -p 'test_drx*.py' -v
        env:
          MPLBACKEND: Agg
